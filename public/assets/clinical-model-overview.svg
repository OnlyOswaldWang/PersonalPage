<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460" role="img" aria-labelledby="title desc">
<title id="title">Multi-task Transformer with static-feature fusion</title><desc id="desc">The first 24 hours of observations and missingness masks enter a Transformer encoder. Static features enter a separate encoder. Their representations are concatenated and passed to three outcome heads.</desc>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="none" stroke="#668095"/></marker></defs>
