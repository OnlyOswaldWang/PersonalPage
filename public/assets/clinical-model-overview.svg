<g fill="#fff" stroke="#d7e0e7" stroke-width="1.5"><rect x="30" y="116" width="190" height="158" rx="5"/><rect x="30" y="311" width="190" height="69" rx="5"/><rect x="270" y="149" width="188" height="99" rx="5"/><rect x="270" y="311" width="188" height="69" rx="5"/><rect x="507" y="167" width="44" height="194" rx="5" fill="#edf2f6"/><rect x="594" y="121" width="138" height="68" rx="5"/><rect x="594" y="224" width="138" height="68" rx="5"/><rect x="594" y="327" width="138" height="68" rx="5"/></g>
<g font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#435d71"><text x="125" y="142" font-size="16" font-weight="600">Hourly observations</text><text x="125" y="165" font-size="12">24 time steps × 12 variables</text><text x="125" y="253" font-size="12">+ missingness indicators</text><text x="125" y="340" font-size="16" font-weight="600">Static features</text><text x="125" y="361" font-size="12">Patient / admission context</text><text x="364" y="179" font-size="17" font-weight="600">Transformer</text><text x="364" y="202" font-size="12">Projection + position embedding</text><text x="364" y="225" font-size="12">Encoder + masked pooling</text><text x="364" y="340" font-size="16" font-weight="600">Static encoder</text><text x="364" y="362" font-size="12">Multilayer perceptron</text><text x="529" y="265" font-size="14" transform="rotate(-90 529 265)">Feature concatenation</text><text x="663" y="148" font-size="14" font-weight="600">In-hospital</text><text x="663" y="169" font-size="14">mortality</text><text x="663" y="250" font-size="14" font-weight="600">24–48 h</text><text x="663" y="272" font-size="14">mortality</text><text x="663" y="354" font-size="14" font-weight="600">ICU length</text><text x="663" y="376" font-size="14">of stay · 3 classes</text></g>
